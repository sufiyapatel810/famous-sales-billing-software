<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Famous Sales Factory Outlet</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;500;600&family=Oswald:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f5f3ea;--card:#fff;--ink:#16150f;--mute:#67635a;--line:#dedad0;--acc:#ffe600;--acc-ink:#111;--or:#c9540a;--bad:#b3261e;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f0f0c;--card:#1a1a15;--ink:#f3f1e6;--mute:#a19d8e;--line:#2e2d25;--acc:#ffe600;--acc-ink:#111;--or:#ff8a3d;--bad:#ff8a80}}
:root[data-theme="dark"]{--bg:#0f0f0c;--card:#1a1a15;--ink:#f3f1e6;--mute:#a19d8e;--line:#2e2d25;--acc:#ffe600;--acc-ink:#111;--or:#ff8a3d;--bad:#ff8a80}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 "IBM Plex Sans",system-ui,sans-serif}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace}
.disp{font-family:"Oswald",sans-serif;letter-spacing:.02em}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding:14px 20px;background:var(--card);border-bottom:1px solid var(--line)}
header input{font-size:18px;font-weight:600;border:1px solid transparent;background:transparent;color:var(--ink);padding:4px 8px;border-radius:6px;min-width:0;width:260px;max-width:100%}
header input:hover,header input:focus{border-color:var(--line)}
nav{display:flex;gap:4px}
nav button{padding:8px 18px;border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:4px;cursor:pointer;font:inherit;font-weight:500;transition:background .12s}
nav button.on{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
main{max-width:1100px;margin:0 auto;padding:20px}
.grid{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:20px}
@media (max-width:820px){.grid{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:4px;padding:18px}
h2{margin:0 0 14px;font-size:15px;font-weight:600;font-family:"Oswald",sans-serif;text-transform:uppercase;letter-spacing:.06em;color:var(--mute);border-bottom:1px solid var(--line);padding-bottom:8px}
input,button{font:inherit}
input[type=text],input[type=number],input[type=search]{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:4px;background:var(--bg);color:var(--ink);transition:border-color .15s}
